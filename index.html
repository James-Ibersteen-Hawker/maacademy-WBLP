    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "MAAcademy",
        "description": "Come and study music and art at the Music and Art Academy!",
        "url": "https://james-ibersteen-hawker.github.io/maacademy-WBLP/",
        "publisher": {
          "@type": "Organization",
          "name": "Music and Art Academy",
          "logo": "https://james-ibersteen-hawker.github.io/maacademy-WBLP/MAINLOGO.png"
        }
      }
    </script>
    <!--Vue-->
    <!-- <script defer src="https://unpkg.com/vue@3.0.11/dist/vue.global.js"></script> -->

      defer
      src="https://unpkg.com/vue@3.0.11/dist/vue.global.prod.js"
    ></script>
    <script defer src="javascript/components.js"></script>
    <script defer src="javascript/classes.js"></script>
    <script defer src="javascript/sheet.js" type="module"></script>
  </head>
  <body>
    <main id="vue_app">
      <nav-bar
        :links="pages"
        logo="MAINLOGO.png"
        :results="results.data"
        :phone="content?.['Phone Number']"
        :address="content?.['Address']"
        :map="content?.['Map']"
        :loading="loading"
        @query="searchSite"
        @choose="runSelection"
      ></nav-bar>
      <div class="header">
        <div class="headerOver">
          <h1>Music <span>𝄞</span> Art Academy</h1>
          <h2>Arts Education is for Everyone!</h2>
          <a href="html/about-us.html" target="_blank">
            <div>Welcome</div>
          </a>
        </div>
        <video
          src="imgs/headerVideo.mov"
          alt="Music and Art Academy"
          class="headerVid"
          loop
          muted
          autoplay
        >
          Your browser does not support this video element
        </video>
      </div>
      <div class="content-container container-fluid">
        <div class="reviews">
          <h1>Asbury Park Press</h1>
          <div v-for="(r, i) in content?.['reviews']" class="review row" :class="{'left': i % 2 === 0, 'right': i % 2 === 1}">
            <div class="text col-12 col-md-8">
              <span>{{r.REVIEWS}}</span>
              <div class="caption">
                {{r["By:"]}}
              </div>
            </div>
            <div class="img col-12 col-md-4">
              <img :src="r.IMAGE" :alt="r['By:']" loading="lazy"/>
            </div>
          </div>
        </div>
      </div>
      <page-footer
        :icons="media"
        :copyright="content?.['copyright']"
      ></page-footer>
    </main>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/fuse.js@7.1.0/dist/fuse.min.js"
    ></script>
    <script defer src="javascript/bootstrap.bundle.min.js"></script>
    <script defer src="javascript/script.js"></script>
  </body>
